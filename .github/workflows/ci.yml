name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: muri1o/pipelines/.github/workflows/ci.yml@main
    with:
      image: muri1o/whatsapp-bot
      node-version: '20'
      test-command: npm test
      enable-stryker: true
      enable-playwright: true
      k6-script: test/performance/load.js
    secrets: inherit
