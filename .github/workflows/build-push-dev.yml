name: Build and Push (dev)

on:
  push:
    branches: [dev]

jobs:
  ci:
    uses: muri1o/pipelines/.github/workflows/ci.yml@main
    with:
      image: muri1o/whatsapp-bot
    secrets: inherit

  build-push:
    needs: ci
    uses: muri1o/pipelines/.github/workflows/build-push.yml@main
    with:
      image: muri1o/whatsapp-bot
      tag: dev-${{ github.sha }}
    secrets: inherit
